services:
  primary:
    image: postgres:16
    container_name: pg-primary
    environment:
      POSTGRES_PASSWORD: pass
    ports: ["5440:5432"]
    volumes:
      - ./init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  replica1:
    image: postgres:16
    container_name: pg-replica1
    user: postgres
    environment:
      PGPASSWORD: rep
    ports: ["5441:5432"]
    depends_on:
      primary:
        condition: service_healthy
    command: >
      bash -c "if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
      pg_basebackup -h primary -U replicator -D /var/lib/postgresql/data -R -X stream &&
      chmod 700 /var/lib/postgresql/data; fi; exec postgres"

  replica2:
    image: postgres:16
    container_name: pg-replica2
    user: postgres
    environment:
      PGPASSWORD: rep
    ports: ["5442:5432"]
    depends_on:
      primary:
        condition: service_healthy
    command: >
      bash -c "if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
      pg_basebackup -h primary -U replicator -D /var/lib/postgresql/data -R -X stream &&
      chmod 700 /var/lib/postgresql/data; fi; exec postgres -c recovery_min_apply_delay=5s"